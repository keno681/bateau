name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript
        run: npm run check
      - name: Test persistent modifications
        run: node --test tests/patch-store.test.cjs
      - name: Build portable Windows executable
        run: npm run build:windows
      - name: Create checksum and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(Get-ChildItem 'dist/Derniere-Vague-*-Windows-x64.exe')
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one portable Windows executable.' }
          $exe = $artifacts[0]
          $checksum = $exe.FullName + '.sha256'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content $checksum -Encoding ascii
          $zip = Join-Path $exe.DirectoryName ($exe.BaseName + '.zip')
          $folder = Join-Path $exe.DirectoryName 'zip/Derniere-Vague'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item -Path @($exe.FullName, $checksum) -Destination $folder
          Copy-Item -Path 'patches/exemple-couleur.json' -Destination (Join-Path $folder 'EXEMPLE-POKEBALL.json')
          @'
          DERNIÈRE VAGUE — Windows 10/11, 64 bits
          Faites un clic droit sur le ZIP puis « Extraire tout ».
          Ouvrez le dossier extrait puis double-cliquez sur le fichier .exe.
          La Pokéball ouvre l’atelier : collez un script JSON puis cliquez sur Valider et redémarrer le jeu.
          Les modifications sont conservées sur ce PC. F8 permet de revenir à la version d’origine.
          EXEMPLE-POKEBALL.json contient un premier script à copier dans l’atelier.
          F11 : plein écran. Programme non signé.
          '@ | Set-Content (Join-Path $folder 'LISEZ-MOI.txt') -Encoding utf8
          Compress-Archive -Path $folder -DestinationPath $zip
          gh release create "$env:GITHUB_REF_NAME" "$($exe.FullName)" "$checksum" "$zip" --verify-tag --title "Dernière Vague $env:GITHUB_REF_NAME — Windows" --notes-file '.github/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
